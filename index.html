<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Potter Random Spells</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50; /* Fundal închis pentru contrast */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .spell-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 500px;
            border: 1px solid #dcdcdc;
        }

        /* Stil pentru imaginea SVG generată intern */
        .hogwarts-crest {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            /* Umbră ușoară pentru efect 3D */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        h1 {
            color: #4b3b63;
            font-size: 26px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            background-color: #f9f9f9;
            border-radius: 8px;
            overflow: hidden; /* Colțuri rotunjite la tabel */
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #4b3b63; /* Mov închis magic */
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        button {
            background-color: #d3a625; /* Auriu Hogwarts */
            color: #2c3e50;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background-color: #e5b936;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="spell-container">
        
        <h1>Harry Potter Spells</h1>
        <p class="subtitle">Descoperă magia de la Hogwarts</p>
        <img 
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Harry_Potter_wordmark.svg/2180px-Harry_Potter_wordmark.svg.png" 
            alt="Harry Potter Logo" 
            class="hogwarts-crest"
        >

        <table>
            <thead>
                <tr>
                    <th>Nume</th>
                    <th>Incantație</th>
                    <th>Tip</th>
                </tr>
            </thead>
            <tbody id="spell-table-body">
                <tr>
                    <td colspan="3" style="color: #777; font-style: italic;">
                        Așteptând bagheta magică...
                    </td>
                </tr>
            </tbody>
        </table>

        <button id="cast-spell-btn">Cast Spell ✨</button>

    </div>

    </body>
</html>
